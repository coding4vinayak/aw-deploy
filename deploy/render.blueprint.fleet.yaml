      - key: PRODUCT_NAME
        value: "abetConnect"
      - key: NEXT_PUBLIC_APP_URL
        value: https://connect.abetworks.in
      - key: DATABASE_URL
        fromDatabase:
          name: aw-abetConnect-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SEAT_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SEAT_ANNUAL
