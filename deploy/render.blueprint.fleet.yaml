      - key: PRODUCT_NAME
        value: "leadworks"
      - key: NEXT_PUBLIC_APP_URL
        value: https://leadworks.abetworks.in
      - key: DATABASE_URL
        fromDatabase:
          name: aw-leadworks-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: aw-leadworks-kv
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_FLAT_MONTHLY
        sync: false
      - key: STRIPE_PRICE_FLAT_ANNUAL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false

  - type: web
    name: aw-abetConnect
    repo: https://github.com/coding4vinayak/aw-abetConnect
    branch: main
    runtime: node
    plan: starter
    region: singapore
    healthCheckPath: /
    buildCommand: npm ci && npx prisma generate && npm run build
