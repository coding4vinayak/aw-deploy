###############################################################################
# Render Blueprint — Abetworks Hub, live at hub.abetworks.in  (16 Oct 2026)
#
# WHAT THIS REPLACES — an audit of the previous version of this file (which
# described 36 services: "hub + 35 standalone tool repos" like abet-siteread,
# abet-apihealth, …, abetworks-hub) found that NONE of those 36 repos exist on
# GitHub, and Render does not substitute `${GH_ACCOUNT}`-style variables in
# `repo:` fields — so that blueprint could never import.
#
# WHAT ACTUALLY EXISTS — `aw-abethub`: ONE Next.js app that carries all 35
# tools as independent routes (`/answerready`, `/api/answerready`, `/coldopener`,
# …). Its own README: "One deployable Next.js app; every tool route is
# independent." This blueprint provisions exactly that.
#
# COST — `starter` ≈ $7/mo + 1 GB disk ≈ $0.25/mo. Starter, not free, because:
#   * free instances sleep after ~15 min idle (cold starts for visitors), and
#   * free instances cannot attach a persistent disk — and the hub appends
#     every captured lead to /data/leads.json. Disk-less means leads vanish on
#     the next deploy. Leads are the point; $7/mo is the cheapest way to keep
#     them. (If you ever want $0 instead, drop `disk:` too — accept lead loss.)
#
# IMPORT — Render → New → Blueprint → repo `aw-deploy` → this file.
# `aw-abethub` also carries its own equivalent render.yaml; either path
# creates the same `abetworks-hub` service.
#
# WANT THE STANDALONE-PER-SUBDOMAIN TOPOLOGY BACK? Create those repos first,
# then add one service per repo with a literal `repo: https://github.com/...`
# URL. Never reintroduce ${...} placeholders — Render treats them as literal
# text in this file.
###############################################################################

previews:
  generation: "off"

services:
  - type: web
    name: abetworks-hub
    repo: https://github.com/coding4vinayak/aw-abethub
    branch: main
    runtime: node
    plan: starter
    region: singapore
    healthCheckPath: /
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    domains:
      - hub.abetworks.in
    disk: # current spec shape: singular `disk` + `mountPath` (not `disks`/`path`)
      name: hub-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Where lead captures land — must match the disk path above, or the disk
      # is paid for and unused.
      - key: DATA_DIR
        value: /data
      # Optional AI quality upgrade for the compose-style tools (coldopener,
      # coldangle, answerready, emailaudit, meetingprep). Leave blank to keep
      # the deterministic engines.
      - key: ABET_API_KEY
        sync: false
      - key: ABET_API_BASE
        sync: false
      # Owner-only view/export of captured leads: GET /api/leads (Bearer token
      # or ?token=; add ?format=csv for the ESP import). Blank keeps the route
      # disabled (503). Pick any long random string.
      - key: LEADS_TOKEN
        sync: false
      # Optional: webhook POSTed for every captured lead ({ email, tool, at }),
      # so a lead is actionable without opening the Render shell. Any HTTPS
      # endpoint (Slack workflow, Zapier, your own service). Blank = off.
      - key: LEAD_NOTIFY_URL
        sync: false
      # Canonical public site for the hub's suite links (header CTA, footer,
      # product upsells). Override only while the DNS switch to
      # abetworks.in is mid-flight (then point it at the current site URL).
      - key: SUITE_URL
        value: https://abetworks.in
