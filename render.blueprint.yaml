# Render Blueprint — Abetworks Hub + all 35 standalone tools (36 services).
# Host render.blueprint.yaml somewhere public (or paste in Render dashboard) and import it.
# Render will ask once for GH_ACCOUNT (GitHub user/org holding the repos).
services:
  - type: web
    name: abetworks-hub
    repo: https://github.com/${GH_ACCOUNT}/abetworks-hub
    branch: main
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
  - type: web
    name: abet-siteread
    repo: https://github.com/${GH_ACCOUNT}/abet-siteread
